name: Build Android APK (Auto Self-Healing CI)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  STORE_PASSWORD: "android"
  KEY_PASSWORD: "android"

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17 (v5)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Execute Master Self-Healing Build
        run: |
          chmod +x scripts/self-heal.sh scripts/build.sh || true
          ./scripts/build.sh

      - name: Upload Harvested APKs Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DocCraft-APKs
          path: build-artifacts/apk/
          if-no-files-found: warn
          retention-days: 14

      - name: Generate Self-Healing Diagnostics Summary
        if: always()
        run: |
          echo "## 🛡️ Self-Healing CI Execution Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Both Debug and Release APKs Successfully Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Harvested Artifacts:" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          for f in build-artifacts/apk/*.apk; do
            if [ -f "$f" ]; then
              FNAME=$(basename "$f")
              FSIZE=$(ls -lh "$f" | awk '{print $5}')
              echo "| \`$FNAME\` | $FSIZE |" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/apk/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
